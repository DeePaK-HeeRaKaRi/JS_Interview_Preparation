<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
</head>
<body>
    <div class='container'>
        <h1>Tasks List</h1>
    </div>

    <div class="container columns">
        <div class="column">
            <div class="column-title">
                <h3 data-tasks="0">To Do</h3>
                <button class="open-modal">+</button>
            </div>
            <div class="tasks todo" id="todo"></div>
        </div>

         <div class="column">
            <div class="column-title">
                <h3 data-tasks="0">Inprogress</h3>
                <button class="open-modal">+</button>
            </div>
            <div class="tasks inProgress" id="inProgress"></div>
        </div>

         <div class="column">
            <div class="column-title">
                <h3 data-tasks="0">Completed</h3>
                <button class="open-modal">+</button>
            </div>
            <div class="tasks completed" id="completed"></div>
        </div>
    </div>


    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Add Task</h2>
            <form class="form" id="task-form">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="description">Description:</label>
                <textarea id="description" name="description" required></textarea>

                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="todo">To Do</option>
                    <option value="inprogress">In Progress</option>
                    <option value="completed">Completed</option>   
                </select>   

                <button type="submit" class="add-task">Add Task</button>
            </form>
        </div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Tabs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Main Tabs */
        .main-tabs {
            display: flex;
            gap: 10px;
            background: #f8f8f8;
            padding: 10px;
            border-bottom: 2px solid #007bff;
        }

        .tab {
            padding: 10px 15px;
            cursor: pointer;
            background: #ddd;
            border: 1px solid #ccc;
            position: relative;
        }

        .tab:hover {
            background: #bbb;
        }

        /* Sub-tabs - Initially hidden */
        .sub-tabs {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            background: #f8f8f8;
            border: 1px solid #ccc;
            padding: 5px;
            min-width: 150px;
        }

        .sub-tab {
            padding: 5px 10px;
            cursor: pointer;
            background: #eee;
            position: relative;
            border-left: 2px solid #007bff;
            transition: margin-left 0.2s;
        }

        .sub-tab:hover {
            background: #ddd;
        }

        /* Show sub-tabs on hover */
        .tab-container:hover > .sub-tabs,
        .sub-tab-container:hover > .sub-tabs {
            display: block;
        }

        /* Indentation for nested tabs */
        .nested {
            margin-left: 15px;
        }
    </style>
</head>
<body>

    <div class="main-tabs" id="main-tabs-container"></div>

    <script>
        const tabData = [
            {
                name: "Tab 1",
                children: [
                    { name: "Child Tab 1", children: [] },
                    { 
                        name: "Child Tab 2", 
                        children: [
                            { name: "Child Tab 2-1", children: [] }
                        ]
                    },
                    { 
                        name: "Child Tab 3", 
                        children: [
                            { name: "Child Tab 3-1", children: [] }
                        ]
                    }
                ]
            },
            { name: "Tab 2", children: [] },
            { name: "Tab 3", children: [] }
        ];

        function createTabs(tabData, parentElement, level = 0) {
            tabData.forEach(tab => {
                const tabContainer = document.createElement("div");
                tabContainer.classList.add(level === 0 ? "tab-container" : "sub-tab-container");

                const tabElement = document.createElement("div");
                tabElement.classList.add(level === 0 ? "tab" : "sub-tab");
                tabElement.textContent = tab.name;

                tabContainer.appendChild(tabElement);
                parentElement.appendChild(tabContainer);

                if (tab.children.length > 0) {
                    const subTabContainer = document.createElement("div");
                    subTabContainer.classList.add("sub-tabs");

                    createTabs(tab.children, subTabContainer, level + 1);

                    tabContainer.appendChild(subTabContainer);
                }
            });
        }

        const mainTabsContainer = document.getElementById("main-tabs-container");
        createTabs(tabData, mainTabsContainer);
    </script>

</body>
</html>
